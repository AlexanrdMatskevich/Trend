<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trending · GitHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <span class="topbar-logo">
      <svg height="32" viewBox="0 0 16 16" width="32" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8 8 0 0 1-5.47 7.59c-.4.08-.53-.17-.53-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.13.46-.53.38A8.003 8.003 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
    </span>
    <nav class="topbar-nav">
      <a href="index.html">Trending</a>
    </nav>
  </div>
</header>

<main class="container page-body">
  <div class="box">
    <div class="box-header">
      <nav class="subnav" id="view-tabs">
        <a href="#/repositories" class="subnav-item is-selected" data-view="repositories">Repositories</a>
        <a href="#/developers" class="subnav-item" data-view="developers">Developers</a>
      </nav>

      <div class="filters" id="filters">
        <details class="select-menu" id="menu-language">
          <summary>Language: <span class="menu-value" data-value-for="language">Any</span></summary>
          <div class="select-menu-panel">
            <div class="select-menu-panel-header">Select a language</div>
            <input type="text" class="filter-input" placeholder="Filter languages" data-filter-for="language">
            <div class="select-menu-list" data-list-for="language"></div>
          </div>
        </details>

        <details class="select-menu" id="menu-spoken-language">
          <summary>Spoken Language: <span class="menu-value" data-value-for="spoken_language">Any</span></summary>
          <div class="select-menu-panel">
            <div class="select-menu-panel-header">Select a spoken language</div>
            <input type="text" class="filter-input" placeholder="Filter spoken languages" data-filter-for="spoken_language">
            <div class="select-menu-list" data-list-for="spoken_language"></div>
          </div>
        </details>

        <details class="select-menu" id="menu-date">
          <summary>Date range: <span class="menu-value" data-value-for="date_range">Today</span></summary>
          <div class="select-menu-panel">
            <div class="select-menu-panel-header">Adjust time span</div>
            <div class="select-menu-list" data-list-for="date_range"></div>
          </div>
        </details>
      </div>
    </div>

    <div id="list-repositories" class="trend-list"></div>
    <div id="list-developers" class="trend-list" hidden></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner" id="footer-content"></div>
</footer>

<div class="overlay-backdrop" id="lists-backdrop" hidden>
  <div class="Overlay Overlay-whenNarrow Overlay--size-small-portrait" id="lists-overlay" role="dialog" aria-modal="true" aria-label="Add to list">
    <div class="Overlay-header">
      <h3 class="Overlay-title">Add to list</h3>
      <button type="button" class="Overlay-close" id="lists-close" aria-label="Close">&times;</button>
    </div>
    <div class="Overlay-body" id="lists-body"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
